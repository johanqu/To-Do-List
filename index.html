<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato&display=swap"
      rel="stylesheet"
    />
    <title>To-Do List</title>
  </head>
  <body>
    <div class="contenedor">
      <h1>To-Do List</h1>

      <div class="contenedor2">
        <input class="tarea" type="text" placeholder="Add your task" />
        <input class="boton" type="button" value="Add" />
      </div>

      <ul class="lista">
        <li>
          <label> <input type="checkbox" /> Create a Js project </label>
          <button>&times</button>
        </li>
        <li>
          <label> <input type="checkbox" /> upload it online </label>
          <button>&times</button>
        </li>
        <li>
          <label>
            <input type="checkbox" /> Add project link in the resume
          </label>
          <button>&times</button>
        </li>
      </ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
